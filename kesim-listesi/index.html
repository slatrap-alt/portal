<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kesim Listesi</title>
<style>
:root{
  --navy:#222a3a; --navy2:#3b4763; --accent:#b3242b; --line:#d3d8e1; --soft:#f5f6f9;
  --text:#1c2430; --muted:#6b7686; --bg:#e4e7ee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* ---------- Araç çubuğu ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toolbar .brand{font-weight:700;letter-spacing:.5px;margin-right:auto}
.btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1b1b;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.toolbar label.opt{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}

/* ---------- Sayfa ---------- */
.sheet{background:#fff;width:210mm;max-width:100%;margin:18px auto;padding:12mm 12mm 14mm;box-shadow:0 4px 18px rgba(20,35,60,.15);min-height:297mm}
input,select,textarea{font:inherit;color:inherit}
.sheet input,.sheet select,.sheet textarea{border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;width:100%;outline:none}
.sheet input:hover,.sheet select:hover,.sheet textarea:hover{border-color:var(--line);background:#fcfdff}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--navy2);background:#fff;box-shadow:0 0 0 2px rgba(42,70,112,.15)}
::placeholder{color:#a9b2bf}

/* Üst başlık */
.head{display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--navy);padding-bottom:10px;position:relative}
.head::after{content:"";position:absolute;left:0;bottom:-8px;width:90px;height:4px;background:var(--accent)}
.logo-box{width:86px;height:86px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex:none;color:var(--muted);font-size:11px;text-align:center}
.logo-box img{max-width:100%;max-height:100%}
.logo-box:not(.empty){border-color:transparent}
.head .firma{flex:1}
.head .firma input{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:.5px;padding:2px 4px}
.head .firma .alt input{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:1px}
.head .baslik{text-align:right}
.head .baslik .tarih{font-size:13px;font-weight:600;color:var(--muted);padding-right:6px;margin-top:2px}
.head .baslik input{font-size:20px;font-weight:700;color:var(--navy);text-align:right;letter-spacing:2px}

/* Bilgi kutusu */
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:22px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.info .cell{padding:6px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.info .cell:nth-child(4n){border-right:0}
.info .cell.wide{grid-column:span 2}
.info .cell.full{grid-column:1/-1;border-right:0}
.info .cell:nth-last-child(-n+1){border-bottom:0}
.info label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.info input{font-weight:600;padding:3px 0 !important}

/* Bloklar */
.blok{margin-top:18px;break-inside:auto}
.blok-head{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:6px 6px 0 0;padding:4px 10px}
.blok-head .tag{font-size:10px;letter-spacing:1px;opacity:.7;text-transform:uppercase;white-space:nowrap}
.blok-head input{color:#fff !important;font-weight:700;font-size:15px;letter-spacing:.5px}
.blok-head input:hover,.blok-head input:focus{background:rgba(255,255,255,.12) !important;border-color:rgba(255,255,255,.4) !important}
.blok-head .pvcwrap{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--accent);color:#1b1b1b;padding:3px 10px;border-radius:4px;font-weight:700;white-space:nowrap}
.blok-head .pvcwrap select{color:#1b1b1b !important;width:76px;text-align:center;padding:2px 4px;font-size:14px;font-weight:700;cursor:pointer;border-color:rgba(0,0,0,.25) !important}
.blok-head .pvcwrap select:hover,.blok-head .pvcwrap select:focus{background:rgba(255,255,255,.5) !important}
.blok-head .x{background:transparent;border:0;color:#fff;opacity:.6;cursor:pointer;font-size:18px;padding:0 4px}
.blok-head .x:hover{opacity:1}
.blok-head .note-toggle{flex:none;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.08);color:#fff;border-radius:6px;padding:5px 8px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.blok-head .note-toggle:hover{background:rgba(255,255,255,.18)}
.blok.no-notes table.kesim col.aciklama,.blok.no-notes table.kesim th.aciklama,.blok.no-notes table.kesim td.aciklama{display:none !important}

table.kesim{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid var(--navy)}
table.kesim th{background:#e4eaf3;color:var(--navy);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:6px 4px;border:1px solid var(--line);text-align:center}
table.kesim th.grp{background:#d5deec}
table.kesim td{border:1px solid var(--line);padding:0;height:27px}
table.kesim td input,table.kesim td select{border-radius:0 !important;text-align:center;height:26px;padding:2px 4px !important}
table.kesim td.sira{text-align:center;color:var(--muted);font-weight:600;background:var(--soft);font-size:12px}
table.kesim td.aciklama input{text-align:left}
table.kesim td.del{border:0;width:26px;text-align:center}
table.kesim td.del button{border:0;background:transparent;color:#b94a48;cursor:pointer;font-size:15px;opacity:.5}
table.kesim td.del button:hover{opacity:1}
table.kesim tbody tr:nth-child(even) td:not(.sira){background:#fafbfd}
table.kesim select{appearance:none;-webkit-appearance:none;cursor:pointer}
table.kesim tfoot td{background:var(--soft);font-weight:700;color:var(--navy);padding:6px 8px;height:auto;text-align:center;font-size:12px}
.col-sira{width:9%}.col-boy{width:15%}.col-en{width:15%}.col-adet{width:10%}.col-pvc{width:10%}.col-not{width:auto}.col-del{width:26px}
.addrow{margin-top:6px;border:1px dashed var(--navy2);background:transparent;color:var(--navy2);padding:5px 12px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px}
.addrow:hover{background:var(--soft)}
.addblok{display:block;margin:22px auto 0;border:2px dashed var(--navy2);background:transparent;color:var(--navy2);padding:10px 20px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.addblok:hover{background:var(--soft)}

/* Özet */
.ozet{margin-top:22px;break-inside:avoid}
.ozet h3{margin:0 0 6px;font-size:12px;letter-spacing:2px;color:var(--navy);text-transform:uppercase;border-left:4px solid var(--accent);padding-left:8px}
.ozet table{width:100%;border-collapse:collapse;font-size:13px}
.ozet th,.ozet td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.ozet th{background:var(--navy);color:#fff;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.ozet td:first-child{text-align:left;font-weight:600}
.ozet tr.genel td{background:#e4eaf3;font-weight:800;color:var(--navy)}
.not-box{margin-top:14px;break-inside:avoid}
.not-box label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600}
.not-box textarea{min-height:54px;resize:vertical;border:1px solid var(--line) !important;margin-top:3px}
.imza{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:26px;break-inside:avoid}
.imza div{border-top:1px solid var(--navy);padding-top:4px;text-align:center;font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;height:50px}
.foot{margin-top:14px;text-align:center;font-size:10px;color:var(--muted)}

/* Ekranda boş satır soluk */
tr.empty td.sira{opacity:.45}


/* ---------- Görsel iyileştirmeler ---------- */
.toolbar{background:linear-gradient(90deg,#1a202d,#2f3a52);border-bottom:3px solid var(--accent)}
.btn{border-radius:8px;transition:.15s}
.btn.primary{color:#fff;box-shadow:0 2px 6px rgba(179,36,43,.45)}
.logo-box{width:96px;height:96px;border-radius:10px}
.head{gap:20px;padding-bottom:12px;border-bottom:3px solid var(--navy)}
.head::after{height:3px;bottom:-6px;width:130px}
.head .firma input{font-size:28px;letter-spacing:1.5px}
.head .baslik input{font-size:22px;letter-spacing:4px}
.head .baslik .tarih{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:1px}
.info{margin-top:24px;border-radius:8px;border-color:var(--line);box-shadow:0 1px 3px rgba(20,30,50,.06)}
.info .cell{background:#f7f8fb}
.info label{color:var(--accent);font-weight:700}
.blok{margin-top:20px}
.blok-head{background:linear-gradient(90deg,var(--navy),var(--navy2));border-left:6px solid var(--accent);padding:5px 10px 5px 12px}
.blok-head .pvcwrap{background:var(--accent);color:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.blok-head .pvcwrap select{color:#fff !important;border-color:rgba(255,255,255,.45) !important}
.blok-head .pvcwrap select option{color:#1c2430;background:#fff}
.blok-head .pvcwrap select:hover,.blok-head .pvcwrap select:focus{background:rgba(255,255,255,.18) !important}
table.kesim{border:1.5px solid var(--navy)}
table.kesim th{background:#eceff5;color:var(--navy)}
table.kesim th.grp{background:#dde2ec}
table.kesim td.sira{background:#eef0f5;color:var(--navy2)}
table.kesim tbody tr:nth-child(even) td:not(.sira){background:#f8f9fc}
table.kesim tfoot td{background:#eceff5;border-top:2px solid var(--navy)}
.ozet th{background:var(--navy)}
.ozet tr.genel td{background:#f8e6e7;color:var(--accent);font-size:14px}
.ozet h3{border-left-color:var(--accent)}
.imza div{border-top-color:var(--navy)}
@media screen{ .sheet{border-top:6px solid var(--accent);border-radius:4px} }

.head .firma{flex:1 1 0;min-width:0}
.head .baslik{flex:0 0 250px}

/* ---------- Gri tonlu ayrım ---------- */
table.kesim th{background:#cfd4dc;color:#1c2330;border-color:#aeb5c1}
table.kesim th.grp{background:#b9c0cb}
table.kesim td{border-color:#9aa3b3}
table.kesim tbody tr td{background:#fff}
table.kesim tbody tr:nth-child(even) td{background:#d3d8e0}
table.kesim tbody tr td.sira{background:#c3c8d3;color:#2b3447}
table.kesim tbody tr:nth-child(even) td.sira{background:#b0b7c5}
table.kesim tfoot td{background:#cfd4dc;border-top:2px solid var(--navy)}
.toolbar .brand{display:flex;align-items:center;gap:12px}
.toolbar .blogo{background:#fff;border-radius:8px;padding:2px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toolbar .blogo img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.toolbar .btxt{display:flex;flex-direction:column;line-height:1.15}
.toolbar .btxt b{font-size:17px;letter-spacing:1.5px}
.toolbar .btxt small{font-size:11px;letter-spacing:2px;opacity:.7;text-transform:uppercase;font-weight:500}

.btn.wa{border-color:#25d366;color:#25d366;font-weight:600}
.btn.wa:hover{background:rgba(37,211,102,.15)}
.btn:disabled{opacity:.6;cursor:wait}
#toast{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90vw;background:#222a3a;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);border-left:5px solid var(--accent);z-index:50;font-size:13px}
.dupwarn{margin-top:6px;padding:6px 10px;background:#fff4d6;border:1px solid #e3b341;color:#7a5200;border-radius:6px;font-size:12px;font-weight:600}
.dupwarn:empty{display:none}
@media screen{ table.kesim tbody tr.dup td{background:#fde3b0 !important} }
@media screen and (max-width:760px){
  body{font-size:15px}
  .toolbar{position:static;padding:8px 10px;gap:6px}
  .toolbar .brand{flex:1 1 100%}
  .toolbar .btn{padding:10px 10px;font-size:12.5px;flex:1 1 auto}
  .toolbar label.opt{font-size:12px;flex:1 1 100%}
  #savedProjects{flex:1 1 100%;max-width:none !important;min-height:38px}
  #cloudStatus{flex:1 1 100%;min-width:0 !important}
  .sheet{width:100%;margin:0;padding:12px 10px 22px;min-height:0;border-radius:0}
  .head{flex-wrap:wrap;gap:10px}
  .logo-box{width:64px;height:64px}
  .head .firma{flex:1 1 calc(100% - 80px)}
  .head .firma input{font-size:20px}
  .head .baslik{flex:1 1 100%;text-align:left}
  .head .baslik input{text-align:left;font-size:17px;letter-spacing:2px}
  .info{grid-template-columns:1fr}
  .info .cell,.info .cell.wide,.info .cell.full{grid-column:auto;border-right:0}
  .blok-head{flex-wrap:wrap;gap:6px}
  .blok-head input{font-size:14px;min-width:100px;flex:1 1 100%}
  .blok-head .pvcwrap{margin-left:0;padding:4px 8px;font-size:12px}
  .blok-head .note-toggle{font-size:11px;padding:6px 8px;flex:1 1 auto}
  .blok-head .x{margin-left:auto}
  .sheet input,.sheet select,.sheet textarea{font-size:16px}
  table.kesim td{height:42px}
  table.kesim td input,table.kesim td select{height:40px}
  .col-sira{width:9%}.col-boy{width:17%}.col-en{width:17%}.col-adet{width:12%}.col-pvc{width:10%}.col-del{width:34px}
  table.kesim th{font-size:9.5px;letter-spacing:0;padding:4px 2px}
  table.kesim td.del button{font-size:18px;padding:8px}
  .ozet table{font-size:12px}.ozet th,.ozet td{padding:5px 4px}
  .imza{gap:8px}
  #toast{left:10px;right:10px;transform:none;max-width:none}
}
/* ---------- Yazdırma / PDF ---------- */
@page{size:A4 portrait;margin:9mm 9mm 15mm 9mm;@bottom-center{content:"Sayfa " counter(page) " / " counter(pages);font-family:"Segoe UI",Arial,sans-serif;font-size:9pt;color:#6b7686}}
@media print{
  html,body{background:#fff}
  .toolbar,.noprint,.addrow,.addblok,td.del,th.del,col.col-del,.blok-head .x,.logo-box.empty{display:none !important}
  .sheet{box-shadow:none;margin:0;width:auto;padding:0;min-height:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet input,.sheet select,.sheet textarea{border-color:transparent !important;background:transparent !important;box-shadow:none !important}
  ::placeholder{color:transparent !important}
  textarea{resize:none}
  .not-box.hide-print{display:none}
  .dupwarn,#toast{display:none !important}
  table.kesim tbody tr td{background:#fff !important}
  table.kesim tbody tr td.sira{background:#c3c8d3 !important}
  table.kesim tbody tr.zp td{background:#d3d8e0 !important}
  table.kesim tbody tr.zp td.sira{background:#b0b7c5 !important}
  .blok-head .pvcwrap{padding:4px 14px}
  .blok-head .pvcwrap select{appearance:none !important;-webkit-appearance:none !important;-moz-appearance:none !important;background-image:none !important;border:0 !important;width:auto !important;padding:0 0 0 4px !important;text-align:left;font-size:15px;color:#fff !important}
  body:not(.showempty) tr.empty{display:none}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  .blok-head{break-after:avoid}
  .info .cell.noval{display:none}
  .info:not(:has(.cell:not(.noval))){display:none}
  body.supplier.noacik .aciklama{display:none !important}
  body.supplier .info,body.supplier .ozet,body.supplier .not-box,body.supplier .imza,body.supplier tfoot{display:none !important}
}

/* ---------- Kompakt araç çubuğu ---------- */
.toolbar{gap:14px;padding:8px 14px;align-items:center}
.toolbar .brand{flex:0 0 auto;margin-right:0}
.toolbar-main{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.tool-group{display:flex;align-items:center;gap:5px;padding-left:10px;border-left:1px solid rgba(255,255,255,.18)}
.tool-group:first-child{padding-left:0;border-left:0}
.toolbar .icon-btn{width:38px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;border-radius:8px;flex:0 0 auto}
.toolbar .icon-btn.primary{color:#fff}
.toolbar .danger-btn:hover{background:rgba(220,70,70,.22);border-color:#e58a8a}
.toolbar .project-select{width:190px;max-width:190px;height:36px;padding:0 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .cloud-status{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:650;color:#e7edf7;min-width:110px;max-width:190px;line-height:1.25;padding:7px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.07);white-space:nowrap}
.toolbar .cloud-status::before{content:"";width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#aab4c3;box-shadow:0 0 0 3px rgba(170,180,195,.14)}
.toolbar .cloud-status.is-connected{color:#d9ffe7;border-color:rgba(48,210,116,.35);background:rgba(27,155,83,.14)}
.toolbar .cloud-status.is-connected::before{background:#35d477;box-shadow:0 0 0 3px rgba(53,212,119,.18),0 0 9px rgba(53,212,119,.45)}
.toolbar .cloud-status.is-error,.toolbar .cloud-status.is-offline{color:#ffe0e0;border-color:rgba(255,100,100,.35);background:rgba(180,45,55,.16)}
.toolbar .cloud-status.is-error::before,.toolbar .cloud-status.is-offline::before{background:#ff626b;box-shadow:0 0 0 3px rgba(255,98,107,.16)}
.toolbar .cloud-status.is-pending::before{background:#f0bd4e;box-shadow:0 0 0 3px rgba(240,189,78,.16)}
.toolbar label.opt{font-size:11px;white-space:nowrap;gap:4px}
.toolbar label.opt input{margin:0}
@media(max-width:1100px){
  .toolbar{align-items:flex-start}
  .toolbar-main{justify-content:flex-start}
  .tool-group{padding-left:7px}
  .toolbar .cloud-status{max-width:130px}
}
@media(max-width:760px){
  .toolbar{position:static;padding:8px 10px;gap:8px}
  .toolbar .brand{flex:1 1 100%}
  .toolbar-main{width:100%;justify-content:flex-start;gap:7px}
  .tool-group{padding-left:7px}
  .toolbar .icon-btn{width:40px;height:40px;font-size:19px}
  .toolbar .project-select{width:min(48vw,210px);max-width:min(48vw,210px);height:40px;flex:0 1 auto}
  .toolbar .cloud-status{flex:1 1 100%;max-width:none;min-width:0;padding:2px 0}
  .option-tools{flex:1 1 100%;border-left:0;padding-left:0;flex-wrap:wrap}
}


/* İşlem simgeleri: WhatsApp, PDF ve tedarikçi mesajı */
.toolbar .wa.icon-btn{color:#25d366;border-color:#25d366}
.toolbar .wa.icon-btn svg{display:block}
.toolbar .pdf-btn{width:42px;color:#ff737b}
.toolbar .pdf-btn:hover{color:#ff9298;background:rgba(255,105,115,.12);border-color:#ff737b}
.toolbar .pdf-icon{display:block;width:25px;height:25px;overflow:visible}

</style>
</head>
<body>

<div class="toolbar">
  <div class="brand"><span class="blogo"><img id="brandLogo" alt=""></span><span class="btxt"><b>ACANLAR MOBİLYA</b><small>Kesim Listesi Programı</small></span></div>

  <div class="toolbar-main">
    <div class="tool-group project-tools" aria-label="Kesim listesi işlemleri">
      <button class="btn primary icon-btn" id="btnCloudSave" title="Veritabanına kaydet" aria-label="Veritabanına kaydet">☁</button>
      <select id="savedProjects" class="btn project-select" title="Kayıtlı kesim listeleri" aria-label="Kayıtlı kesim listeleri" style="background:#fff;color:#222a3a;border-color:#9aa3b3">
        <option value="">Kayıtlı kesim listeleri</option>
      </select>
      <button class="btn icon-btn" id="btnCloudLoad" title="Seçili kaydı aç" aria-label="Seçili kaydı aç">📂</button>
      <button class="btn icon-btn danger-btn" id="btnCloudDelete" title="Seçili kaydı sil" aria-label="Seçili kaydı sil">🗑</button>
      <button class="btn icon-btn" id="btnNew" title="Yeni kesim listesi" aria-label="Yeni kesim listesi">＋</button>
    </div>

    <div class="tool-group cloud-tools" aria-label="Bulut hesabı">
      <button class="btn icon-btn" id="btnCloudAccount" title="Bulut hesabına bağlan" aria-label="Bulut hesabına bağlan">☁↗</button>
      <button class="btn icon-btn" id="btnCloudLogout" title="Bulut hesabından çıkış" aria-label="Bulut hesabından çıkış" style="display:none">⇥</button>
      <span id="cloudStatus" class="cloud-status">Bulut bağlantısı bekleniyor</span>

  var PREF_KEY = 'kesimListesi.prefs.v1';
  var previousDraft = null, prefs = null;
  document.getElementById('brandLogo').src = DEFAULT_LOGO;
  try { previousDraft = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ previousDraft = null; }
  try { prefs = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); } catch(e){ prefs = null; }
  // Eski sürümde tercihler yalnızca taslak içinde tutuluyordu. Bunları bir kez taşı,
  // fakat son kesim listesini otomatik açma: her yeni oturum temiz listeyle başlasın.
  if(!prefs && previousDraft){
    prefs = {firma:previousDraft.firma,altbaslik:previousDraft.altbaslik,baslik:previousDraft.baslik,logo:previousDraft.logo,birim:previousDraft.birim,supAcik:previousDraft.supAcik};
  }
  var S = defaults();
  if(prefs){
    ['firma','altbaslik','baslik','logo','birim','supAcik'].forEach(function(k){ if(prefs[k] !== undefined && prefs[k] !== null) S[k] = prefs[k]; });
  }
  if(!S.logo) S.logo = DEFAULT_LOGO;
  S.bloklar.forEach(function(b){ if(b.showNotes === undefined) b.showNotes = true; });
  var preparedFiles = {supplier:null, full:null};

  var $ = function(s,ctx){ return (ctx||document).querySelector(s); };
  var esc = function(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var num = function(v){ var n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
  var fmt = function(n,d){ return n.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}); };
  var isEmpty = function(r){ return !(r.boy||r.en||r.adet||r.pb||r.pe||r.not); };

  var saveT;
  function clearPreparedFiles(){
    preparedFiles.supplier = null; preparedFiles.full = null;
    var wa=$('#btnWA'), sup=$('#btnSupplier');
    if(wa){ wa.dataset.ready=''; wa.textContent="WhatsApp'a Gönder"; }
    if(sup){ sup.dataset.ready=''; sup.textContent='Tedarikçiye Gönder'; }
  }
  function save(){
    clearTimeout(saveT);
    clearPreparedFiles();
    saveT = setTimeout(function(){
      try{
        localStorage.setItem(KEY, JSON.stringify(S));
        localStorage.setItem(PREF_KEY, JSON.stringify({firma:S.firma,altbaslik:S.altbaslik,baslik:S.baslik,logo:S.logo,birim:S.birim,supAcik:S.supAcik}));
      }catch(e){}
    }, 250);
  }

  function rowHTML(bi, ri, r){
    var sel = function(f,v){
      return '<select data-b="'+bi+'" data-r="'+ri+'" data-f="'+f+'">'+
        '<option value=""'+(v===''?' selected':'')+'></option>'+
        '<option value="1"'+(v==='1'?' selected':'')+'>1</option>'+
        '<option value="2"'+(v==='2'?' selected':'')+'>2</option></select>';
    };
    var inp = function(f,v,extra){
      return '<input type="text" '+(extra||'')+' data-b="'+bi+'" data-r="'+ri+'" data-f="'+f+'" value="'+esc(v)+'">';
    };
    return '<tr class="'+(isEmpty(r)?'empty':'')+'" data-row="'+bi+'-'+ri+'">'+
      '<td class="sira">'+(ri+1)+'</td>'+
      '<td>'+inp('boy',r.boy,'inputmode="decimal" autocomplete="off"')+'</td>'+
      '<td>'+inp('en',r.en,'inputmode="decimal" autocomplete="off"')+'</td>'+
      '<td>'+inp('adet',r.adet,'inputmode="numeric" autocomplete="off"')+'</td>'+
      '<td>'+sel('pb',r.pb)+'</td>'+
      '<td>'+sel('pe',r.pe)+'</td>'+
      '<td class="aciklama">'+inp('not',r.not,'autocomplete="off"')+'</td>'+
      '<td class="del"><button type="button" data-del="'+bi+'-'+ri+'" title="Satırı sil">✕</button></td>'+
    '</tr>';
  }

  var PVC_LIST = ['0,40','0,80','1,00','2,00'];
  function pvcOptions(cur){
    var l = PVC_LIST.slice(); if(cur && l.indexOf(cur)<0) l.push(cur);
    return l.map(function(v){ return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'; }).join('');
  }
  function blockHTML(b, bi){
    var rows = b.rows.map(function(r,ri){ return rowHTML(bi,ri,r); }).join('');
    return '<section class="blok'+(b.showNotes===false?' no-notes':'')+'" data-blok="'+bi+'">'+
      '<div class="blok-head">'+
        '<span class="tag">Malzeme</span>'+
        '<input type="text" data-bm="'+bi+'" value="'+esc(b.malzeme)+'" placeholder="Malzeme / Renk (ör. PARLAK BEYAZ SUNTA)">'+
        '<span class="pvcwrap">PVC <select data-bp="'+bi+'">'+pvcOptions(b.pvc)+'</select></span>'+
        '<button type="button" class="note-toggle noprint" data-toggle-notes="'+bi+'">Açıklama: '+(b.showNotes===false?'Gizli':'Açık')+'</button>'+
        '<button class="x noprint" type="button" data-delblok="'+bi+'" title="Bu malzeme bölümünü sil">✕</button>'+
      '</div>'+
      '<table class="kesim">'+
        '<colgroup><col class="col-sira"><col class="col-boy"><col class="col-en"><col class="col-adet"><col class="col-pvc"><col class="col-pvc"><col class="col-not aciklama"><col class="col-del"></colgroup>'+
        '<thead>'+
          '<tr><th rowspan="2">Sıra</th><th rowspan="2">Boy <span class="u">('+esc(S.birim)+')</span></th><th rowspan="2">En <span class="u">('+esc(S.birim)+')</span></th><th rowspan="2">Adet</th>'+
          '<th class="grp" colspan="2">PVC <span class="pv">'+esc(b.pvc)+'</span></th><th rowspan="2" class="aciklama">Açıklama</th><th rowspan="2" class="del"></th></tr>'+
          '<tr><th class="grp">Boy</th><th class="grp">En</th></tr>'+
        '</thead>'+
        '<tbody>'+rows+'</tbody>'+
        (b.showNotes===false
          ? '<tfoot><tr><td colspan="3" style="text-align:right">TOPLAM · PVC <span data-t="pvc"></span></td><td data-t="adet"></td><td colspan="2" data-t="m2"></td><td class="del" style="border:0;background:#fff"></td></tr></tfoot>'
          : '<tfoot><tr><td colspan="3" style="text-align:right">TOPLAM</td><td data-t="adet"></td><td colspan="2" data-t="m2"></td><td data-t="pvc"></td><td class="del" style="border:0;background:#fff"></td></tr></tfoot>')+
      '</table>'+
      '<button type="button" class="addrow" data-addrow="'+bi+'">+ Satır ekle</button>'+
      '<div class="dupwarn noprint" data-dup></div>'+
    '</section>';
  }

  function render(){
    document.body.classList.toggle('showempty', !!S.showEmpty);
    $('#showEmpty').checked = !!S.showEmpty;
    $('#supAcik').checked = S.supAcik !== false;

    var logo = S.logo
      ? '<div class="logo-box" id="logoBox" title="Logoyu değiştirmek için tıklayın"><img src="'+S.logo+'" alt=""></div>'
      : '<div class="logo-box empty" id="logoBox" title="Logo ekle">Logo<br>ekle</div>';

    var info = function(label,key,type,cls,ph){
      var has = !!S[key];
      return '<div class="cell '+(cls||'')+(has?'':' noval')+'"><label>'+label+'</label>'+
        '<input type="'+(type||'text')+'" data-top="'+key+'" value="'+esc(S[key])+'" placeholder="'+(ph||'')+'"></div>';
    };

    var html =
      '<div class="head">'+logo+
        '<div class="firma"><input type="text" data-top="firma" value="'+esc(S.firma)+'" placeholder="Firma adı">'+
        '<div class="alt"><input type="text" data-top="altbaslik" value="'+esc(S.altbaslik)+'" placeholder="Adres / telefon (isteğe bağlı)"></div></div>'+
        '<div class="baslik"><input type="text" data-top="baslik" value="'+esc(S.baslik)+'"><div class="tarih" id="autoDate">'+todayTR()+'</div></div>'+
      '</div>'+
      '<div class="info">'+
        info('Müşteri / Cari','musteri','text','wide','Müşteri adı')+
        info('Sipariş No','siparis','text','wide','')+
        info('Proje / Mekan','proje','text','full','ör. Mutfak dolabı')+
      '</div>'+
      '<div id="bloklar">'+S.bloklar.map(blockHTML).join('')+'</div>'+
      '<button type="button" class="addblok" id="addBlok">+ Yeni malzeme bölümü ekle (ör. MEBRAN, ARKALIK, CAMLI KAPAK)</button>'+
      '<div class="ozet"><h3>Özet</h3><table id="ozet"></table></div>'+
      '<div class="not-box'+(S.not?'':' hide-print')+'" id="notBox"><label>Notlar</label><textarea data-top="not" placeholder="Not yazabilirsiniz...">'+esc(S.not)+'</textarea></div>'+
      '<div class="imza"><div>Hazırlayan</div><div>Kontrol</div><div>Onay</div></div>'+
      '<div class="foot noprint">Birim: '+
        '<select id="birim" style="width:auto;display:inline-block"><option value="cm"'+(S.birim==='cm'?' selected':'')+'>cm</option><option value="mm"'+(S.birim==='mm'?' selected':'')+'>mm</option></select>'+
        ' · Ondalık için virgül veya nokta kullanabilirsiniz · Enter = alttaki satıra geç</div>'+
      '';

    $('#root').innerHTML = html;
    updateTotals();
  }

  function calcBlock(b){
    var adet=0,m2=0,pvc=0, k = S.birim==='mm' ? 1e6 : 1e4, kp = S.birim==='mm' ? 1000 : 100;
    b.rows.forEach(function(r){
      var a = num(r.adet); if(!a && (r.boy||r.en)) a = 1;
      var bo=num(r.boy), en=num(r.en);
      adet += a;
      m2 += bo*en*a/k;
      pvc += (bo*num(r.pb) + en*num(r.pe))*a/kp;
    });
    return {adet:adet,m2:m2,pvc:pvc};
  }

  function zebra(){
    document.querySelectorAll('table.kesim tbody').forEach(function(tb){
      var n=0;
      tb.querySelectorAll('tr').forEach(function(tr){
        var show = S.showEmpty || !tr.classList.contains('empty');
        tr.classList.remove('zp');
        if(show){ if(n%2===1) tr.classList.add('zp'); n++; }
      });
    });
  }
  function updateTotals(){
    zebra();
    var G={adet:0,m2:0,pvc:0}, rowsHtml='';
    S.bloklar.forEach(function(b,bi){
      var c = calcBlock(b);
      G.adet+=c.adet; G.m2+=c.m2; G.pvc+=c.pvc;
      var sec = $('[data-blok="'+bi+'"]');
      if(sec){
        $('[data-t="adet"]',sec).textContent = fmt(c.adet,0);
        $('[data-t="m2"]',sec).textContent = fmt(c.m2,2)+' m²';
        $('[data-t="pvc"]',sec).textContent = 'PVC '+fmt(c.pvc,2)+' m';
        var pv = $('.pv',sec); if(pv) pv.textContent = b.pvc;
        var seen={}, trs = sec.querySelectorAll('tbody tr'), msgs=[];
        b.rows.forEach(function(r,ri){ var bo=num(r.boy), en=num(r.en); if(bo&&en){ var k=bo+' × '+en; (seen[k]=seen[k]||[]).push(ri); } });
        Array.prototype.forEach.call(trs,function(tr){ tr.classList.remove('dup'); });
        Object.keys(seen).forEach(function(k){
          if(seen[k].length>1){
            seen[k].forEach(function(ri){ if(trs[ri]) trs[ri].classList.add('dup'); });
            msgs.push(k+' → satır '+seen[k].map(function(x){return x+1;}).join(', '));
          }
        });
        var dw = $('[data-dup]',sec);
        if(dw) dw.textContent = msgs.length ? '⚠ Aynı ölçü birden fazla girilmiş: '+msgs.join(' | ')+' (adetleri birleştirmek isteyebilirsiniz)' : '';
      }
      rowsHtml += '<tr><td>'+esc(b.malzeme||('Bölüm '+(bi+1)))+'</td><td>'+fmt(c.adet,0)+'</td><td>'+fmt(c.m2,2)+'</td><td>'+esc(b.pvc)+' → '+fmt(c.pvc,2)+'</td></tr>';
    });
    $('#ozet').innerHTML = '<tr><th style="text-align:left">Malzeme</th><th>Parça adedi</th><th>Alan (m²)</th><th>PVC (m)</th></tr>'+rowsHtml+
      '<tr class="genel"><td>GENEL TOPLAM</td><td>'+fmt(G.adet,0)+'</td><td>'+fmt(G.m2,2)+'</td><td>—</td></tr>';
  }

  /* ---------- Olaylar ---------- */
  var root = $('#root');

  root.addEventListener('input', function(e){
    var t = e.target;
    if(t.dataset.top){ S[t.dataset.top] = t.value; var cl=t.closest('.cell'); if(cl) cl.classList.toggle('noval', !t.value); if(t.dataset.top==='not'){ $('#notBox').classList.toggle('hide-print', !t.value); } save(); return; }
    if(t.dataset.bm!==undefined){ S.bloklar[+t.dataset.bm].malzeme = t.value; updateTotals(); save(); return; }
    if(t.dataset.bp!==undefined){ S.bloklar[+t.dataset.bp].pvc = t.value; updateTotals(); save(); return; }
    if(t.dataset.f){ rowChanged(t); }
  });
  root.addEventListener('change', function(e){
    var t = e.target;
    if(t.id==='birim'){ S.birim = t.value; save(); render(); return; }
    if(t.dataset.bp!==undefined){ S.bloklar[+t.dataset.bp].pvc = t.value; updateTotals(); save(); return; }
    if(t.dataset.f){ rowChanged(t); }
  });

  function rowChanged(t){
    var bi=+t.dataset.b, ri=+t.dataset.r, b=S.bloklar[bi], r=b.rows[ri];
    r[t.dataset.f] = t.value;
    var tr = t.closest('tr'); tr.classList.toggle('empty', isEmpty(r));
    // Son satıra yazılırsa otomatik yeni satır ekle
    if(ri===b.rows.length-1 && !isEmpty(r)){ addRow(bi,false); }
    updateTotals(); save();
  }

  function addRow(bi, focus){
    var b=S.bloklar[bi]; b.rows.push(newRow());
    var tb = $('[data-blok="'+bi+'"] tbody');
    tb.insertAdjacentHTML('beforeend', rowHTML(bi,b.rows.length-1,b.rows[b.rows.length-1]));
    if(focus){ var el = tb.lastElementChild.querySelector('input'); if(el) el.focus(); }
    save();
  }

  root.addEventListener('keydown', function(e){
    var t = e.target;
    if(e.key==='Enter' && t.tagName==='INPUT' && t.dataset.f){
      e.preventDefault();
      var bi=+t.dataset.b, ri=+t.dataset.r, f=t.dataset.f;
      var sel = '[data-b="'+bi+'"][data-r="'+(ri+1)+'"][data-f="'+f+'"]';
      var nx = $(sel);
      if(!nx){ addRow(bi,false); nx = $(sel); }
      if(nx){ nx.focus(); if(nx.select) nx.select(); }
    }
  });

  root.addEventListener('click', function(e){
    var t = e.target;
    if(t.closest('#logoBox')){ $('#fileLogo').click(); return; }
    if(t.dataset.toggleNotes!==undefined){ var nbi=+t.dataset.toggleNotes; S.bloklar[nbi].showNotes = S.bloklar[nbi].showNotes===false; save(); render(); return; }
    if(t.id==='addBlok'){ S.bloklar.push(newBlock('', '0,40')); save(); render(); return; }
    if(t.dataset.addrow!==undefined){ addRow(+t.dataset.addrow,true); return; }
    if(t.dataset.del){
      var p = t.dataset.del.split('-'), bi=+p[0], ri=+p[1], b=S.bloklar[bi];
      b.rows.splice(ri,1); if(!b.rows.length) b.rows.push(newRow());
      save(); render(); return;
    }
    if(t.dataset.delblok!==undefined){
      if(S.bloklar.length<2){ alert('En az bir bölüm kalmalı.'); return; }
      if(confirm('Bu malzeme bölümü ve içindeki tüm satırlar silinsin mi?')){ S.bloklar.splice(+t.dataset.delblok,1); save(); render(); }
    }
  });
  $('#fileLogo').addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){ S.logo = fr.result; save(); render(); };
    fr.readAsDataURL(f); e.target.value='';
  });

  /* ---------- Araç çubuğu ---------- */
  $('#showEmpty').addEventListener('change', function(e){ S.showEmpty = e.target.checked; document.body.classList.toggle('showempty', S.showEmpty); zebra(); save(); });

  function pdfTitle(){
    var parts=[S.firma||'Firma','Kesim Listesi'];
    if(document.body.classList.contains('supplier')) parts.push('Tedarikci'); else { if(S.musteri) parts.push(S.musteri); if(S.siparis) parts.push(S.siparis); }
    return parts.join(' - ');
  }
  var oldTitle = document.title;
  window.addEventListener('beforeprint', function(){ var ad=$('#autoDate'); if(ad) ad.textContent=todayTR(); oldTitle=document.title; document.title = pdfTitle(); });
  window.addEventListener('afterprint', function(){ document.title = oldTitle; document.body.classList.remove('supplier','noacik'); });
  function isMobileLayout(){
    return window.matchMedia('(max-width:760px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  }
  $('#btnPrint').addEventListener('click', function(){
    document.body.classList.remove('supplier','noacik');
    if(isMobileLayout()){ createPdf('full', this, 'download'); return; }
    window.print();
  });
  $('#supAcik').addEventListener('change', function(e){ S.supAcik = e.target.checked; save(); });
  $('#btnSupplier').addEventListener('click', function(){
    if(!isMobileLayout()){
      document.body.classList.add('supplier');
      document.body.classList.toggle('noacik', S.supAcik === false);
      window.print();
      return;
    }

    createPdf('supplier', this, 'share');
  });

  $('#btnNew').addEventListener('click', function(){
    if(!confirm('Mevcut liste temizlenip yeni liste açılsın mı? (Firma adı ve logo korunur)')) return;
    var keep = {firma:S.firma, altbaslik:S.altbaslik, baslik:S.baslik, logo:S.logo, birim:S.birim, supAcik:S.supAcik};
    S = Object.assign(defaults(), keep);
    // Yeni liste, daha önce açılmış bulut kaydının üzerine yazmamalı.

    var saved = $('#savedProjects');

  });

  /* ---------- Mobil uyumlu, optimize PDF ve dosya paylaşımı ---------- */
  var LIB_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
  var libP = null;
  function loadLib(){
    if(window.html2pdf) return Promise.resolve();
    if(libP) return libP;
    libP = new Promise(function(res,rej){
      var sc=document.createElement('script'); sc.src=LIB_URL; sc.onload=res;
      sc.onerror=function(){ libP=null; rej(new Error('PDF aracı yüklenemedi')); };
      document.head.appendChild(sc);
    });
    return libP;
  }
  // Kitaplığı önceden yükle; kullanıcı dokunuşu PDF hazırlanırken kaybolmasın.
  setTimeout(function(){ loadLib().catch(function(){}); }, 700);

  function toast(msg,ms){
    var t=$('#toast'); t.textContent=msg; t.style.display='block';
    clearTimeout(toast.t); toast.t=setTimeout(function(){ t.style.display='none'; }, ms||5000);
  }
  function formatBytes(bytes){
    if(bytes < 1024) return bytes+' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+' KB';
    return (bytes/(1024*1024)).toFixed(2)+' MB';
  }
  function safeFileName(text){ return String(text||'Kesim Listesi').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim(); }
  function makeFileName(kind){
    var suffix = kind==='supplier' ? 'Tedarikci Kesim Listesi' : 'Kesim Listesi';
    var who = S.musteri ? ' - '+S.musteri : '';
    var order = S.siparis ? ' - '+S.siparis : '';
    return safeFileName((S.firma||'Firma')+who+order+' - '+suffix+' - '+todayTR())+'.pdf';
  }

  function buildSupplierDoc(){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'width:718px;background:#fff;color:#1c2430;font-family:"Segoe UI",Arial,sans-serif;font-size:12px;padding:0';
    var h = '<table style="width:100%;border-collapse:collapse;border-bottom:3px solid #222a3a"><tr>'+
      (S.logo ? '<td style="width:92px;padding:0 0 10px"><img src="'+S.logo+'" style="width:80px;height:80px;object-fit:contain"></td>' : '')+
      '<td style="font-size:26px;font-weight:800;color:#222a3a;padding:0 0 10px">'+esc(S.firma)+'</td>'+
      '<td style="text-align:right;padding:0 0 10px;white-space:nowrap"><div style="font-size:20px;font-weight:700;letter-spacing:3px;color:#222a3a">'+esc(S.baslik)+'</div>'+
      '<div style="color:#b3242b;font-weight:700;font-size:12px;margin-top:3px">'+todayTR()+'</div></td></tr></table>';
    var th = 'padding:6px 4px;border:1px solid #9aa3b3;text-align:center;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#1c2330;';
    S.bloklar.forEach(function(b){
      var rows = b.rows.filter(function(r){ return !isEmpty(r); });
      if(!rows.length) return;
      var showN = S.supAcik !== false && b.showNotes !== false;
      h += '<table style="width:100%;border-collapse:collapse;margin-top:18px"><tr>'+
        '<td style="background:#222a3a;color:#fff;font-weight:700;font-size:14px;padding:9px 12px;border-left:6px solid #b3242b">'+esc(b.malzeme||'—')+'</td>'+
        '<td style="background:#b3242b;color:#fff;font-weight:700;font-size:14px;padding:9px 12px;text-align:right;width:120px">PVC '+esc(b.pvc)+'</td></tr></table>';
      h += '<table style="width:100%;border-collapse:collapse;table-layout:fixed;border:1.5px solid #222a3a">'+
        '<thead><tr>'+
        '<th rowspan="2" style="'+th+'background:#cfd4dc;width:'+(showN?'8%':'11%')+'">Sıra</th>'+
        '<th rowspan="2" style="'+th+'background:#cfd4dc">Boy ('+esc(S.birim)+')</th>'+
        '<th rowspan="2" style="'+th+'background:#cfd4dc">En ('+esc(S.birim)+')</th>'+
        '<th rowspan="2" style="'+th+'background:#cfd4dc;width:'+(showN?'9%':'12%')+'">Adet</th>'+

  function buildFullDoc(){
    var clone = $('#root').cloneNode(true);
    clone.id = 'pdfExportRoot';
    clone.style.cssText = 'width:718px;max-width:none;margin:0;padding:28px 30px 34px;min-height:0;background:#fff;box-shadow:none;border:0;border-radius:0';
    clone.querySelectorAll('.noprint,.addrow,.addblok,.dupwarn,.del,.col-del').forEach(function(el){ el.remove(); });
    clone.querySelectorAll('.info .cell.noval,.not-box.hide-print').forEach(function(el){ el.remove(); });
    if(!S.showEmpty) clone.querySelectorAll('tr.empty').forEach(function(el){ el.remove(); });
    clone.querySelectorAll('input,select,textarea').forEach(function(el){
      var span = document.createElement('span');
      var cs = window.getComputedStyle(el);
      for(var i=0;i<cs.length;i++){
        var prop=cs[i];
        try{ span.style.setProperty(prop,cs.getPropertyValue(prop),cs.getPropertyPriority(prop)); }catch(e){}
      }
      Object.keys(el.dataset || {}).forEach(function(k){ span.dataset[k]=el.dataset[k]; });
      span.className = el.className || '';
      span.textContent = el.tagName==='SELECT' ? (el.options[el.selectedIndex] ? el.options[el.selectedIndex].textContent : '') : el.value;
      span.style.display = el.tagName==='TEXTAREA' ? 'block' : (cs.display==='inline'?'inline-block':'block');
      span.style.whiteSpace = el.tagName==='TEXTAREA' ? 'pre-wrap' : 'normal';
      span.style.overflowWrap = 'anywhere';
      span.style.minHeight = el.tagName==='TEXTAREA' ? '42px' : span.style.minHeight;
      el.replaceWith(span);
    });
    var wrap=document.createElement('div');
    wrap.className='pdf-export';
    wrap.style.cssText='width:718px;background:#fff;padding:0;margin:0 auto';

      '.pdf-export .head .baslik{flex:0 0 250px!important;text-align:right!important}'+
      '.pdf-export .head .firma [data-top="firma"]{font-size:28px!important;font-weight:800!important;color:#222a3a!important;letter-spacing:1.5px!important}'+
      '.pdf-export .head .firma .alt [data-top="altbaslik"]{font-size:12px!important;font-weight:500!important;color:#6b7686!important}'+
      '.pdf-export .head .baslik [data-top="baslik"]{font-size:22px!important;font-weight:700!important;text-align:right!important;letter-spacing:3px!important;color:#222a3a!important}'+
      '.pdf-export .info{grid-template-columns:repeat(4,1fr)!important}'+

      '.pdf-export .blok-head .pvcwrap{margin-left:auto!important}'+
      '.pdf-export .col-sira{width:9%!important}.pdf-export .col-boy,.pdf-export .col-en{width:15%!important}.pdf-export .col-adet{width:10%!important}.pdf-export .col-pvc{width:10%!important}.pdf-export .col-del{width:26px!important}'+

  function makePdf(kind){
    return loadLib().then(function(){
      var el = kind==='supplier' ? buildSupplierDoc() : buildFullDoc();
      var imgs = Array.prototype.slice.call(el.querySelectorAll('img')).map(function(im){
        return new Promise(function(resolve){
          if(im.complete && im.naturalWidth) resolve();
          else { im.onload=resolve; im.onerror=resolve; }
        });
      });
      return Promise.all(imgs).then(function(){
        var rowCount=0;
        S.bloklar.forEach(function(b){ rowCount += b.rows.filter(function(r){ return !isEmpty(r); }).length; });
        // 4x PNG, 40 MB+ dosyalara neden oluyordu. 2.1–2.6x kaliteli JPEG,
        // yazıyı yakınlaştırınca okunaklı tutarken dosya boyutunu ciddi azaltır.
        var scale = rowCount>100 ? 2.10 : (rowCount>45 ? 2.35 : 2.65);
        function renderAt(targetScale,quality){
          var opts = {
            margin:[9,9,13,9],
            image:{type:'jpeg',quality:quality},
            html2canvas:{scale:targetScale,useCORS:true,backgroundColor:'#ffffff',letterRendering:true,logging:false},
            jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
            pagebreak:{mode:['css','legacy'],avoid:['tr']}
          };
          return html2pdf().set(opts).from(el).toPdf().get('pdf').then(function(pdf){
            var n=pdf.internal.getNumberOfPages();
            for(var i=1;i<=n;i++){
              pdf.setPage(i); pdf.setFontSize(9); pdf.setTextColor(107,118,134);
              pdf.text('Sayfa '+i+' / '+n,105,290,{align:'center'});
            }
            return {blob:pdf.output('blob'),pages:n};
          });
        }
        return renderAt(scale,0.92).then(function(result){
          // Tek sayfalık çıktı 2 MB'ı aşarsa netliği koruyacak hafif bir ikinci sıkıştırma uygula.
          if(result.pages===1 && result.blob.size>2*1024*1024){
            return renderAt(2.15,0.88).then(function(compact){ return compact.blob; });
          }
          return result.blob;
        });
      });
    });
  }

  function downloadPdf(file){
    var url=URL.createObjectURL(file), a=document.createElement('a');
    a.href=url; a.download=file.name; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },60000);
  }
  function sharePreparedPdf(kind,btn,forceWhatsApp){
    var file=preparedFiles[kind];
    if(!file){ createPdf(kind,btn,forceWhatsApp?'share':'share'); return; }
    var msg=(S.firma||'ACANLAR MOBİLYA')+' - Kesim Listesi ('+todayTR()+')';
    // Web Share çağrısı, dosya hazırlandıktan sonraki gerçek kullanıcı dokunuşunda
    // doğrudan yapılır. Böylece Android/iOS paylaşım izni kaybolmaz.
    var supportsFileShare=false;
    try{ supportsFileShare=!!(navigator.share && navigator.canShare && navigator.canShare({files:[file]})); }catch(e){ supportsFileShare=false; }
    if(supportsFileShare){
      var sharePromise;
      try{ sharePromise=navigator.share({files:[file],title:msg,text:msg}); }
      catch(err){ toast('Paylaşım ekranı açılamadı. PDF dosyasını indirmeyi deneyin.',7000); return; }
      Promise.resolve(sharePromise).then(function(){ toast('Dosya paylaşım ekranına aktarıldı.',4500); })
        .catch(function(err){
          if(err && err.name==='AbortError') return;
          toast('Telefon paylaşımı tamamlayamadı. PDF indirildi; WhatsApp’ta ataç simgesiyle ekleyin.',9000);
          downloadPdf(file);
        });
      return;
    }
    if(forceWhatsApp) window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
    downloadPdf(file);
    if(forceWhatsApp){
      toast('PDF indirildi. WhatsApp’ta sohbeti açıp ataç simgesiyle indirilen PDF’yi ekleyin.',9000);
    }else{
      toast('PDF indirildi. Dosyayı telefonunuzdaki paylaş menüsünden tedarikçiye iletebilirsiniz.',8000);
    }
  }

  function createPdf(kind,btn,afterCreate){
    var old=btn.textContent;
    btn.disabled=true; btn.textContent='PDF hazırlanıyor…';
    makePdf(kind).then(function(blob){
      var fileName=makeFileName(kind), file;
      if(typeof File==='function') file=new File([blob],fileName,{type:'application/pdf'});
      else { file=blob; try{ file.name=fileName; }catch(e){} }
      preparedFiles[kind]=file;
      if(kind==='supplier'){
        $('#btnSupplier').dataset.ready='1'; $('#btnSupplier').textContent='PDF hazır · Paylaş';
        $('#btnWA').dataset.ready='1'; $('#btnWA').textContent='WhatsApp’ta Paylaş';
      }
      if(kind==='full'){
        downloadPdf(file);
        toast('PDF indirildi · '+formatBytes(file.size)+' · Yazılar netliği korunarak sıkıştırıldı.',8000);
      }else{
        toast('Tedarikçi PDF’si hazır ('+formatBytes(file.size)+'). Göndermek için “PDF hazır · Paylaş” veya WhatsApp düğmesine tekrar dokunun.',9000);
      }
    }).catch(function(err){
      console.error('PDF oluşturma hatası:',err);
      toast('PDF oluşturulamadı. İnternet bağlantısını kontrol edip tekrar deneyin.',8000);
    }).then(function(){ btn.disabled=false; if(!preparedFiles[kind]) btn.textContent=old; });
  }

  $('#btnWA').addEventListener('click', function(){
    if(preparedFiles.supplier){ sharePreparedPdf('supplier',this,true); return; }
    createPdf('supplier',this,'share');
  });


  /* ---------- Firebase bulut kayıtları ---------- */
  var cloudDb = null, cloudUser = null, activeCloudId = null, cloudReady = false;
  var CUT_COLLECTION = 'acanlar_cut_projects';
  var cloudStatus = $('#cloudStatus');

  function cloudMsg(message, bad){
    cloudStatus.textContent = message;
    cloudStatus.classList.toggle('is-error', !!bad);
    cloudStatus.classList.toggle('is-connected', !bad && !!cloudUser);
    cloudStatus.classList.toggle('is-offline', !bad && !cloudUser && /bağlanılmadı|çıkış/i.test(message));
    cloudStatus.classList.toggle('is-pending', !bad && !cloudUser && !/bağlanılmadı|çıkış/i.test(message));
  }
  function cloudError(err){
    var code = err && err.code ? err.code : '';
    if(code === 'permission-denied') return 'Veritabanı erişim izni yok. Firebase kuralları kontrol edilmeli.';
    if(code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'E-posta veya şifre hatalı.';
    if(code === 'auth/user-not-found') return 'Bu e-posta ile hesap bulunamadı.';
    if(code === 'auth/invalid-email') return 'E-posta adresi geçersiz.';
    return 'Bulut işlemi başarısız: ' + (err && err.message ? err.message : 'Bilinmeyen hata');
  }
  function projectCollection(){
    if(!cloudDb || !cloudUser) throw new Error('Önce atölye hesabınızla buluta bağlanın.');
    return cloudDb.collection(CUT_COLLECTION).doc(cloudUser.uid).collection('items');
  }
  function projectTitle(){
    var parts = [];
    if(S.musteri) parts.push(S.musteri);
    if(S.siparis) parts.push('Sipariş ' + S.siparis);
    if(S.proje) parts.push(S.proje);
    if(!parts.length) parts.push('Kesim Listesi');
    return parts.join(' · ').substring(0,120);
  }
  function refreshCloudList(selectId){
    if(!cloudUser) return Promise.resolve();
    cloudMsg('Kayıtlar getiriliyor…');
    return projectCollection().get().then(function(snap){
      var docs = [], otherCount = 0;
      snap.forEach(function(doc){
        var data = doc.data() || {};
        // Bu uygulama yalnızca kendi işaretli kayıtlarını listeler.
        // Aynı kullanıcı altındaki başka uygulama/veri kayıtları silinmez veya değiştirilmez.
        if(data.app === 'acanlar-kesim-listesi' && data.state && Array.isArray(data.state.bloklar)) {
          docs.push({id:doc.id, data:data});
        } else {
          otherCount++;
        }
      });
      docs.sort(function(a,b){ return (b.data.updatedAt||0)-(a.data.updatedAt||0); });
      var sel = $('#savedProjects');
      sel.innerHTML = '<option value="">Bu uygulamadaki kayıtlar ('+docs.length+')</option>';
      docs.forEach(function(item){
        var d = item.data;
        var op = document.createElement('option');
        op.value = item.id;
        var dt = d.updatedAt ? new Date(d.updatedAt).toLocaleString('tr-TR') : '';
        op.textContent = (d.title || 'Kesim Listesi') + (dt ? ' — '+dt : '');
        sel.appendChild(op);
      });
      if(selectId) sel.value = selectId;
      cloudMsg('Bulut bağlantısı aktif · '+docs.length+' kayıt');
    }).catch(function(e){ cloudMsg(cloudError(e),true); });
  }

  function saveCloudProject(){
    if(!cloudUser){ alert('Önce “Buluta Bağlan” ile atölye hesabınıza giriş yapın.'); return; }
    var btn = $('#btnCloudSave'), old = btn.textContent;
    btn.disabled = true; btn.textContent = 'Kaydediliyor…';
    var now = Date.now(), id = activeCloudId || ('cut_'+now+'_'+uid());
    var payload = JSON.parse(JSON.stringify(S));
    var ref = projectCollection().doc(id);
    ref.get().then(function(existing){
      var data = {
        title: projectTitle(),
        customer: S.musteri || '',
        orderNo: S.siparis || '',
        project: S.proje || '',
        updatedAt: now,
        createdAt: existing.exists ? (existing.data().createdAt || now) : now,
        ownerUid: cloudUser.uid,
        app: 'acanlar-kesim-listesi',
        version: 1,
        state: payload
      };
      return ref.set(data).then(function(){
        activeCloudId = id;
        return refreshCloudList(id);
      });
    }).then(function(){
      toast('Kesim listesi veritabanına kaydedildi.',4000);
    }).catch(function(e){ alert(cloudError(e)); cloudMsg(cloudError(e),true); })
    .then(function(){ btn.disabled=false; btn.textContent=old; });
  }

  function loadCloudProject(){
    var id = $('#savedProjects').value;
    if(!id){ alert('Açmak için önce kayıtlı bir kesim listesi seçin.'); return; }
    if(!cloudUser){ alert('Önce buluta bağlanın.'); return; }
    if(!confirm('Mevcut ekrandaki liste, seçtiğiniz kayıtla değiştirilsin mi?')) return;
    projectCollection().doc(id).get().then(function(doc){
      var data = doc.exists ? (doc.data() || {}) : {};
      if(!doc.exists || data.app !== 'acanlar-kesim-listesi' || !data.state || !Array.isArray(data.state.bloklar)){
        throw new Error('Bu kayıt Kesim Listesi uygulamasına ait değil veya kayıt yapısı geçersiz.');
      }
      S = Object.assign(defaults(), data.state);
      S.bloklar.forEach(function(b){ if(b.showNotes === undefined) b.showNotes = true; });
      activeCloudId = id;
      save(); render();
      cloudMsg('☁ Kayıt açıldı: '+(doc.data().title || 'Kesim Listesi'));
      toast('Kesim listesi veritabanından yüklendi.',4000);
    }).catch(function(e){ alert(cloudError(e)); cloudMsg(cloudError(e),true); });
  }

  function deleteCloudProject(){
    var id = $('#savedProjects').value;
    if(!id){ alert('Silmek için önce bir kayıt seçin.'); return; }
    if(!cloudUser){ alert('Önce buluta bağlanın.'); return; }
    if(!confirm('Seçili kesim listesi veritabanından kalıcı olarak silinsin mi?')) return;
    projectCollection().doc(id).get().then(function(doc){
      var data = doc.exists ? (doc.data() || {}) : {};
      if(!doc.exists) throw new Error('Kayıt bulunamadı.');
      if(data.app !== 'acanlar-kesim-listesi') throw new Error('Güvenlik için yalnızca bu uygulamanın kendi kayıtları silinebilir.');
      return projectCollection().doc(id).delete();
    }).then(function(){
      if(activeCloudId===id) activeCloudId=null;
      $('#savedProjects').value = '';
      return refreshCloudList();
    }).then(function(){ toast('Kayıt veritabanından silindi.',4000); })
    .catch(function(e){ alert(cloudError(e)); cloudMsg(cloudError(e),true); });
  }

  $('#btnCloudSave').addEventListener('click', saveCloudProject);
  $('#btnCloudLoad').addEventListener('click', loadCloudProject);
  $('#btnCloudDelete').addEventListener('click', deleteCloudProject);
  // Açılır listede kayıt seçmek tek başına aktif kaydı değiştirmez.
  // Aktif kayıt yalnızca 'Kaydı Aç' başarılı olduğunda belirlenir.
  $('#savedProjects').addEventListener('change', function(){
    // Bilerek boş bırakıldı: seçim yapmak, yanlışlıkla üzerine kaydetmeye yol açmamalı.
  });

    if(!window.firebase || !firebase.auth){ alert('Bulut bağlantısı henüz hazır değil. Sayfayı yenileyip tekrar deneyin.'); return; }

      .catch(function(e){ alert(cloudError(e)); cloudMsg(cloudError(e),true); });

    if(window.firebase && firebase.auth) firebase.auth().signOut();

          storageBucket:'oykum-6de70.firebasestorage.app',

          $('#savedProjects').innerHTML = '<option value="">Kayıtlı kesim listeleri</option>';
          cloudMsg('Buluta bağlanılmadı · cihaz içi taslak aktif');

    }catch(e){ cloudMsg(cloudError(e),true); }

  // Her yeni oturum boş listeyle başlar; eski kesimler yalnızca veritabanından açılır.
  $('#btnCloudSave').disabled = true;
  $('#btnCloudLoad').disabled = true;

  render();
})();
