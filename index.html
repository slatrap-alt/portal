<div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
<script>
/* Program bağlantılarını aşağıdaki tırnakların içine ekleyin.
   Örnek: fiyatHesaplama: 'https://ornek.com'
   Bağlantılar aynı sekmede açılır. */
const PROGRAM_LINKLERI = {
  isListesi: 'https://slatrap-alt.github.io/kesim/',
  fiyatHesaplama: 'https://slatrap-alt.github.io/acanlar/',
  kesimOptimizasyonu: 'https://slatrap-alt.github.io/610/',
  cizimProgrami: 'https://slatrap-alt.github.io/index.html/',
  cncCamCad: 'https://slatrap-alt.github.io/cnc/'
};
let noticeTimer;
function supportedLink(value){try{const url=new URL(value);return url.protocol==='https:'||url.protocol==='http:'}catch{return false}}
document.querySelectorAll('[data-app]').forEach(link=>{
  const destination=PROGRAM_LINKLERI[link.dataset.app];
  if(supportedLink(destination)){link.href=destination;return;}
  link.addEventListener('click',event=>{
    event.preventDefault();
    const notice=document.querySelector('#notice');
    notice.textContent='Bu programın bağlantısı henüz eklenmedi.';
    notice.hidden=false;
    clearTimeout(noticeTimer);
    noticeTimer=setTimeout(()=>{notice.hidden=true;},3000);
  });
});
</script>
